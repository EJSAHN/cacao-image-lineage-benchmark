name: ci
on:
  push:
  pull_request:
jobs:
  syntax-and-release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - run: python scripts/validate_release.py
      - run: pytest
